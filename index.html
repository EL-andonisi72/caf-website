<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- TODO: link bootstrap for icons -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>coffee | El-andonisi</title>
</head>
<body>
    <!-- ? header | navbar -->
    <header>
        <nav class="navbar section-center">
            <a href="#" class="nav-logo">
                <h2 class="text-logo"><i class="bi bi-cup-hot-fill"></i> <span>coffee</span></h2>
            </a>
            <ul class="nav-menu">
                <!-- !btn burger menu -->
                 <button id="menu-cls-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
                    </svg>
                 </button>
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Menu</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Testimonials</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Gallery</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>
            </ul>
            <!-- !btn open menu -->
            <button id="menu-open-btn"><i class="bi bi-list"></i></button>
        </nav>
    </header>
    
    <main>
        <!-- ? hero section -->
         <section class="hero-section">
            <div class="section-content">
                <div class="hero-text">
                    <h2 class="title">Welcome to Our Coffee Shop</h2>
                    <h3 class="subtitle">Enjoy the finest coffee in town</h3>
                    <p class="description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit harum dolor asperiores non eligendi voluptatum fugiat dolore quos maxime facilis!</p>
                    <!-- * buttons -->
                    <div class="btns">
                        <button class="btn order-now">Order Now</button>
                        <button class="btn learn-more">Learn More</button>
                    </div>
                </div>
                <div class="hero-section-image">
                    <img src="images/coffee-hero-section.png" alt="Hero" class="hero-image">
                </div>
            </div>
         </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
